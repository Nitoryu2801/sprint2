<div class="form-container">
  <div class="form-card">
    <h2 class="form-title">Registrar Desviación de Calidad</h2>

    <form [formGroup]="deviationForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="lotId">ID del Lote</label>
        <input id="lotId" type="text" formControlName="lotId" placeholder="Ej. LOT-102" />
      </div>

      <div class="form-group">
        <label for="severity">Nivel de Severidad</label>
        <select id="severity" formControlName="severity">
          <option value="LOW">Baja (LOW)</option>
          <option value="MEDIUM">Media (MEDIUM)</option>
          <option value="HIGH">Alta (HIGH)</option>
          <option value="CRITICAL">Crítica (CRITICAL)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="description">Descripción del Evento</label>
        <textarea id="description" rows="4" formControlName="description" placeholder="Describa el hallazgo o alteración detectada..."></textarea>
      </div>

      <div class="form-actions">
        <button type="button" class="btn-secondary" (click)="onCancel()">Cancelar</button>
        <button type="submit" class="btn-primary" [disabled]="deviationForm.invalid">Registrar Desviación</button>
      </div>
    </form>
  </div>
</div>
